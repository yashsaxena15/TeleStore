services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Logs live in the cache volume, so they survive restarts and rebuilds
      LOG_DIR: /app/cache/logs
    ports:
      - "127.0.0.1:9000:8000"
    volumes:
      - ./cache:/app/cache
      # Downloads and uploads in progress (torrents, leeches, phone upload parts) stay on the
      # server's disk, so a deploy (a new container) doesn't throw them away and start them over
      - ./tg_files:/app/tg_files
    depends_on:
      - mongo
      - pot

  # Answers YouTube's "prove you're not a bot" checks for video downloads (yt-dlp PO tokens)
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true

volumes:
  mongo_data:
