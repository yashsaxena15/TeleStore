services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:8000"
    volumes:
      - ./cache:/app/cache
    depends_on:
      - mongo
      - pot

  # Answers YouTube's "prove you're not a bot" checks for video downloads (yt-dlp PO tokens)
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true

volumes:
  mongo_data:
