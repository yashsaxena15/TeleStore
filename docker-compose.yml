services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:8000"
    volumes:
      - ./cache:/app/cache
    depends_on:
      - mongo

volumes:
  mongo_data:
