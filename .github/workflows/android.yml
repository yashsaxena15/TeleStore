name: Android

on:
  push:
    # Naming tags alone would stop branch pushes from running this, so both are listed
    branches:
      - "**"
    tags:
      - "android-v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('0.1.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the API client (:core)
        run: ./gradlew :core:test --console=plain

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telestore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/telestore-release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TeleStore-${VERSION_NAME}.apk"
          if [ "$HAS_KEYSTORE" != "true" ]; then echo "::warning::Signed with the debug key: add the 4 ANDROID_* secrets to sign releases."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: TeleStore-${{ env.VERSION_NAME }}
          path: android/dist/*.apk

      # Every merge to main replaces the rolling "android-latest" pre-release
      - name: Publish android-latest
        if: github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "TeleStore for Android (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install the APK on your phone; the app also offers updates."

      # A tag like android-v1.0.0 makes a versioned release
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "TeleStore for Android $GITHUB_REF_NAME" --generate-notes
