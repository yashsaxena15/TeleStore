name: Android

on:
  push:
    # Naming tags alone would stop branch pushes from running this, so both are listed
    branches:
      - "**"
    tags:
      - "android-v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Read-only by default; only the publish job (pushes to main and android-v* tags) can write releases
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      # android-v1.2.0 -> 1.2.0; other builds are 1.0.<run>
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('1.0.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      version_name: ${{ steps.out.outputs.version_name }}
      signed: ${{ steps.out.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # TDLib (Telegram's official library, for uploads and playback straight from Telegram) is built
      # from Telegram's own source once per android/tdlib/VERSION and cached; the first build of a
      # new version takes 30-60 minutes. Saved right after it's built, so a later failure doesn't lose it.
      - name: TDLib version
        id: tdlib
        run: echo "key=tdlib-$(cat tdlib/VERSION)-arm64-ndk27-v1" >> "$GITHUB_OUTPUT"

      - name: Restore TDLib
        id: tdlib-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android/tdlib/out
          key: ${{ steps.tdlib.outputs.key }}

      - name: Build TDLib (only when its version changed)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf php-cli
          bash tdlib/build.sh

      - name: Save TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android/tdlib/out
          key: ${{ steps.tdlib.outputs.key }}

      - name: Test the API client (:core)
        run: ./gradlew :core:test --console=plain

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telestore-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/telestore-release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Run logs need a GitHub login; annotations don't. Publish the failure lines so they can be read.
      - name: Show build errors
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/build.log" app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            # One annotation with the lines joined (GitHub shows only 10 per step); task names left out
            lines=$(grep -E "^e: |error:|Error:|What went wrong|^> |FAILED|Lint found" "$f" | grep -v "^> Task " | head -40 | cut -c1-400 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$lines" ] && echo "::error::$lines"
          done

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TeleStore-${VERSION_NAME}.apk"
          if [ "$HAS_KEYSTORE" != "true" ]; then echo "::warning::Signed with the debug key: add the 4 ANDROID_* secrets to sign releases."; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TeleStore-${{ env.VERSION_NAME }}
          path: android/dist/*.apk

      - name: Outputs for the publish job
        id: out
        run: |
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "signed=${HAS_KEYSTORE}" >> "$GITHUB_OUTPUT"

  # Only this job gets a token that can write releases, and only for pushes to main or android-v* tags
  publish:
    needs: build
    if: >-
      github.event_name == 'push' && needs.build.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TeleStore-${{ needs.build.outputs.version_name }}
          path: dist

      # Every merge to main replaces the rolling "android-latest" pre-release
      - name: Publish android-latest
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "TeleStore for Android (latest)" \
            --notes "Built from ${GITHUB_SHA::7} (Build ${VERSION_CODE}). Install the APK on your phone; the app also offers updates."

      # A tag like android-v1.0.0 makes a versioned release
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "TeleStore for Android $VERSION_NAME" --notes "TeleStore for Android $VERSION_NAME (Build ${VERSION_CODE})." --generate-notes
