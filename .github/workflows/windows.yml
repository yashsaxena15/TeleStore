name: Windows app

on:
  push:
    # Naming tags alone would stop branch pushes from running this, so both are listed
    branches:
      - "**"
    tags:
      - "windows-v*"
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    env:
      # windows-v1.2.0 -> 1.2.0; other builds are 1.0.<run>
      VERSION: ${{ format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        run: echo "VERSION=${GITHUB_REF_NAME#windows-v}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==8.3.4 pyinstaller==6.11.1

      # On Windows these also check the DPAPI encryption of the saved sign-ins
      - name: Test
        run: python -m pytest tests -q -p no:cacheprovider

      # The logo as an .ico, for the .exe, the installer and the Start menu
      - name: App icon
        run: python installer/make_icon.py installer/TeleStore.ico

      # The installed app is a folder (starts faster); the portable one is a single .exe
      - name: Build TeleStore
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" telestore_desktop/__init__.py
          common="--noconfirm --windowed --icon installer/TeleStore.ico --collect-submodules pyrogram --add-data telestore_desktop/assets;telestore_desktop/assets"
          pyinstaller $common --onedir --name TeleStore run_telestore.py
          pyinstaller $common --onefile --name "TeleStore-${VERSION}-portable" run_telestore.py
          ls -la dist dist/TeleStore

      # TeleStore-Setup-<version>.exe: installs for this Windows user (no administrator), and is what
      # the app's own updates download and run
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" installer\TeleStore.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "installer\Output\TeleStore-Setup-$env:VERSION.exe" dist\
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TeleStore-Windows-${{ env.VERSION }}
          path: windows/dist/*.exe

      # Every merge to main replaces the rolling "windows-latest" pre-release (the app's Beta updates)
      - name: Publish windows-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes || true
          notes="TeleStore for Windows ${VERSION}, built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s).

          Install with TeleStore-Setup-${VERSION}.exe (it updates itself afterwards), or run the portable .exe without installing."
          gh release create windows-latest dist/*.exe --prerelease --target "$GITHUB_SHA" \
            --title "TeleStore for Windows (latest)" --notes "$notes"

      # A tag like windows-v1.0.0 makes a versioned release
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "TeleStore for Windows $VERSION" --notes "TeleStore for Windows $VERSION." --generate-notes
