name: Windows app

on:
  push:
    # Naming tags alone would stop branch pushes from running this, so both are listed
    branches:
      - "**"
    tags:
      - "windows-v*"
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    env:
      # windows-v1.2.0 -> 1.2.0; other builds are 1.0.<run>
      VERSION: ${{ format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        run: echo "VERSION=${GITHUB_REF_NAME#windows-v}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==8.3.4 pyinstaller==6.11.1

      # On Windows these also check the DPAPI encryption of the saved sign-ins
      - name: Test
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Build TeleStore.exe
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" telestore_desktop/__init__.py
          pyinstaller --noconfirm --onefile --windowed --name "TeleStore-${VERSION}" \
            --collect-submodules pyrogram run_telestore.py
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TeleStore-Windows-${{ env.VERSION }}
          path: windows/dist/*.exe

      # Every merge to main replaces the rolling "windows-latest" pre-release
      - name: Publish windows-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes || true
          gh release create windows-latest dist/*.exe --prerelease --target "$GITHUB_SHA" \
            --title "TeleStore for Windows (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .exe and run it: uploads go straight from your PC to Telegram."

      # A tag like windows-v1.0.0 makes a versioned release
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "TeleStore for Windows $VERSION" --notes "TeleStore for Windows $VERSION." --generate-notes
